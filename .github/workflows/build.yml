
name: Build SkullCavernScanner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Stardew Valley mod build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build mod
        run: dotnet build SkullCavernScanner.csproj --configuration Release
        working-directory: SkullCavernScanner

      - name: Upload installable mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SkullCavernScanner-installable
          path: _releases/*.zip
          if-no-files-found: error
          retention-days: 30
